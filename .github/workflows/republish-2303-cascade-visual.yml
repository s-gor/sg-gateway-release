name: Republish SG-Gateway 23.03 Cascade visual

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-cascade-visual.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b6f8-8210-9c1a-a66abd70aea8/raw?se=2026-09-29T12%3A36%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=9673097a-cac6-5252-a83f-0ea89d89b1b7&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T05%3A28%3A46Z&ske=2026-09-30T05%3A28%3A46Z&sks=b&skv=2026-02-06&sig=sFDp%2Buc0HVKDHFYbDDMzxSutxkNa95OPib7blI3o6dI%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE"             --repo "$GITHUB_REPOSITORY"             --clobber
