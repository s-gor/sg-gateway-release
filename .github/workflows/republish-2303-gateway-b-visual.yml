name: Republish SG-Gateway 23.03 Gateway B visual

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-gateway-b-visual.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-985c-8210-b049-13bb4422eb1e/raw?se=2026-09-29T13%3A23%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=7e52441a-f13f-59a6-828a-ffbc71a2929b&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A07%3A25Z&ske=2026-09-30T04%3A07%3A25Z&sks=b&skv=2026-02-06&sig=/ESULethmTPU6YRhNXHhlkaQOlgaDL%2Bm%2BL/f83T488I%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE" --repo "$GITHUB_REPOSITORY" --clobber
