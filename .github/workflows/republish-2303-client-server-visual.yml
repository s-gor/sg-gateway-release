name: Republish SG-Gateway 23.03 client server visual

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-client-server-visual.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fb38-8210-b4c2-6ee6640d9d24/raw?se=2026-09-29T21%3A05%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=03816c95-9663-517e-ad07-ae138c8f8777&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A57%3A51Z&ske=2026-09-30T06%3A57%3A51Z&sks=b&skv=2026-02-06&sig=gb/XwrjliYUltSORY8NNAxicjrpKEQocThU6qdfjPqc%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Official SG-Gateway 23.03 release package. Built from private source SHA 7588dc220c0d3fe15a836659a91e24e35dd247ac. Protected runtime payload; SHA-256 verified before publication."
