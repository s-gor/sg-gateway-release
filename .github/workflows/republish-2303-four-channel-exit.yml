name: Republish SG-Gateway 23.03 four-channel Cascade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-four-channel-exit.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ddac-8210-a565-9cac4ffdf6f9/raw?se=2026-09-29T17%3A10%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=5068c02d-d983-58c9-9ba7-c90fa282ec64&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A03%3A19Z&ske=2026-09-30T04%3A03%3A19Z&sks=b&skv=2026-02-06&sig=gGL2h9EqbHil1UbPTj%2Bsb3j9mzYyCdveoD6kEEtggT0%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Official SG-Gateway 23.03 release package. Built from private source SHA 2f6837345098f951fef2b20863c1652ff5526b05. Protected runtime payload; SHA-256 verified before publication."
