name: Republish SG-Gateway 23.03 illuminated Cascade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-illuminated-cascade.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5b38-8210-bd61-2434189ca370/raw?se=2026-09-29T17%3A44%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=6b8b4627-9187-5ddf-8a88-1191fe8b8ef8&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A57%3A51Z&ske=2026-09-30T06%3A57%3A51Z&sks=b&skv=2026-02-06&sig=uytf46QsCM2bN0XgurMYjsONPrjQGXn38rxLYWiohY4%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Official SG-Gateway 23.03 release package. Built from private source SHA 3bd2920e3968ded348a13656d2fe40d04241a784. Protected runtime payload; SHA-256 verified before publication."
