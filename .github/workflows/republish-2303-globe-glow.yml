name: Republish SG-Gateway 23.03 globe glow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-globe-glow.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-eae0-8210-ab90-14cb0a4ccdd8/raw?se=2026-09-29T20%3A50%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=d9f137f9-613e-55a8-9724-c4844166a071&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T15%3A15%3A04Z&ske=2026-09-30T15%3A15%3A04Z&sks=b&skv=2026-02-06&sig=Nzuh7txqgfrm6yrkWH7ry28f9ZTFknVjDeJ4IY32W8Q%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "Official SG-Gateway 23.03 release package. Built from private source SHA b1acf346bdc2252b983858a652006d478fc1300c. Protected runtime payload; SHA-256 verified before publication."
