name: Republish SG-Gateway 23.03 VMware stage20 fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/republish-2303-vmware.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9874-8210-bd5e-262d32daff42/raw?se=2026-09-29T11%3A41%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=bd3cfc74-f774-51a6-8e5a-a17ff19fecff&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A52%3A33Z&ske=2026-09-30T03%3A52%3A33Z&sks=b&skv=2026-02-06&sig=ZSlkV5o1bYJ43Wgs0jI4auVDdzLD92UQZuIcGgZDrIk%3D"
      TAG: "v0.1.0-023.03"
      RUN_FILE: "SG-Gateway-0.1.0-023.03-FULL.run"
      SHA_FILE: "SG-Gateway-0.1.0-023.03-FULL-SHA256.txt"
      TRANSFER_FILE: "SG-Gateway-0.1.0-023.03-FULL-TRANSFER.zip"
    steps:
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o release-artifact.zip
          unzip -q release-artifact.zip
          sha256sum -c "$SHA_FILE"
          bash "$RUN_FILE" --verify-only

      - name: Replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUN_FILE" "$SHA_FILE" "$TRANSFER_FILE"             --repo "$GITHUB_REPOSITORY"             --clobber
